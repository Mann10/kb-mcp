[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.1.0"
description = "Knowledge Base MCP Server - Storage Layer"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.19.0",
    "pydantic>=2.0",
    "dulwich>=1.2.17",
    "typer>=0.12.0",
    "fastmcp>=4,<5",
    "psycopg[binary]>=3.2",
]

[project.scripts]
kb-mcp = "kb_mcp.cli:app"
kb-mcp-tokens = "kb_mcp.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
