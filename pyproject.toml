[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.1.0"
description = "Knowledge Base MCP Server - Storage Layer"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.19.0",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
